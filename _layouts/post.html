---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      {% if page.tags %} · {{ page.tags | join: ", " }}{% endif %}
    </p>
  </header>

  <div class="post-body">
    {{ content }}
  </div>

  <p class="back-home"><a href="{{ '/' | relative_url }}">&larr; Back to all posts</a></p>
</article>
